[package]
name = "auto_ptr"
version = "0.1.3"
edition = "2021"

description = "The ultimate RAII smart pointer for Rust. Bringing the proven, elegant memory management philosophy of C++98 to the modern era with Zero-Cost Ownership Transfer™."
authors = ["AlphaQian <Alpha_Qian@proton.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alpha-Qian/rust-crates/tree/main/auto-ptr"

keywords = ["raii", "smart-pointer", "memory-management", "zero-cost", "performance"]
categories = ["memory-management", "data-structures", "no-std"]

[profile.release]
panic = "abort" 
opt-level = 3
lto = true

[profile.dev]
panic = "abort"